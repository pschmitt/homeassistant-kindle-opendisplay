name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  lint:
    uses: pschmitt/ci-workflows/.github/workflows/rust-lint.yaml@main

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pschmitt/ci-workflows/.github/actions/nix-setup@main
      - name: Verify release version
        run: |
          version=$(jq -r .version custom_components/kindle_inkwell/manifest.json)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)" = "$version"
      - name: Build the receiver and Inkwell image
        run: |
          nix build '.#checks.x86_64-linux.protocol' --no-link
          nix build '.#kindle-armv7' --out-link result-armv7
          nix build '.#inkwell-pw4' --out-link result-image
          (cd result-image && sha256sum -c SHA256SUMS)
      - name: Run virtual BLE tests on ARMv7
        run: nix build '.#checks.x86_64-linux.virtual-hci-armv7' --no-link
      - name: Prepare release files
        run: |
          mkdir release
          cp result-image/Inkwell-Paperwhite4-OpenDisplay.zip release/
          install -m 0755 result-armv7/bin/kindle-opendisplay release/kindle-opendisplay-armv7
          (cd release && sha256sum Inkwell-Paperwhite4-OpenDisplay.zip kindle-opendisplay-armv7 > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: kindle-release
          path: release/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kindle-release
          path: release
      - run: sha256sum -c SHA256SUMS
        working-directory: release
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            release/Inkwell-Paperwhite4-OpenDisplay.zip
            release/kindle-opendisplay-armv7
            release/SHA256SUMS
          body: |
            Kindle OpenDisplay for the jailbroken Kindle Paperwhite 4 (10th generation).

            - Download the Inkwell ZIP for a fresh Inkwell installation.
            - For an existing Inkwell installation, use the ARMv7 binary with the post-installer.
            - Use SHA256SUMS to verify both downloads.

            [Kindle installation](https://github.com/pschmitt/homeassistant-kindle-opendisplay/blob/${{ github.ref_name }}/docs/inkwell-image.md) · [Home Assistant integration](https://github.com/pschmitt/homeassistant-kindle-opendisplay/blob/${{ github.ref_name }}/docs/kindle-inkwell.md)
