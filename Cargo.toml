[package]
name = "kindle-opendisplay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
flate2 = "1"
libc = "0.2"
anyhow = "1"
bt-hci-serial = "0.1"
critical-section = { version = "1", features = ["std"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_cell = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
tokio-serial = { version = "5", default-features = false }
toml = "1"
trouble-host = { version = "0.8", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool-mtu-512"] }
